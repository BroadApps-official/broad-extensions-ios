name: BroadExtensionsGallery

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"

packages:
  BroadExtensions:
    path: ../..

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  BroadExtensionsGallery:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: BroadExtensions
        product: BroadExtensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.broadapps.extensions.gallery
        PRODUCT_NAME: BroadExtensionsGallery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Extensions Gallery
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: false
